<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solaris Math · Introducción de 1 minuto</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=Montserrat:wght@800&display=swap" rel="stylesheet">
<style>
  :root{
    --noche:#0B1E3F; --noche2:#132C5C; --azul:#1E5BB8; --naranja:#F28C1B; --sol:#FFD23F; --papel:#F4F7FF;
    --g1:#E63946; --g2:#F28C1B; --g3:#E0A800; --g4:#6FA80F; --g5:#2A9D8F; --g6:#00A6ED; --g7:#1E5BB8; --g8:#6A4C93; --g9:#C0399F; --g10:#FF6F59;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:#050E20;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:#fff}
  button{font:inherit;cursor:pointer}
  button:focus-visible{outline:3px solid var(--sol);outline-offset:3px}

  /* Escenario 16:9 que se escala a la pantalla */
  #marco{position:fixed;inset:0;overflow:hidden}
  #escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;margin:-360px 0 0 -640px;overflow:hidden;transform-origin:center center;
    background:radial-gradient(1200px 600px at 85% 110%,#1d4b8f 0,transparent 60%),radial-gradient(900px 500px at -10% -20%,#2a1f5c 0,transparent 55%),linear-gradient(160deg,var(--noche),var(--noche2));
    border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  #escenario.pausado *{animation-play-state:paused!important}

  /* Cuadrícula de cuaderno y símbolos que flotan */
  .cuadricula{position:absolute;inset:0;opacity:.07;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:32px 32px}
  .simbolo{position:absolute;font-family:'Baloo 2';font-weight:800;color:#fff;opacity:.07;animation:flotar linear infinite}
  @keyframes flotar{from{transform:translateY(40px) rotate(-8deg)}to{transform:translateY(-760px) rotate(10deg)}}

  /* Barra superior */
  .barra-sup{position:absolute;top:18px;left:28px;right:28px;display:flex;align-items:center;justify-content:space-between;z-index:5}
  .marca{display:flex;align-items:center;gap:10px;font-family:'Baloo 2';font-weight:700;font-size:20px;opacity:.9}
  .marca svg{width:210px;height:auto}
  .controles{display:flex;gap:8px}
  .ctl{height:40px;min-width:40px;padding:0 12px;border-radius:999px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;transition:background .15s}
  .ctl:hover{background:rgba(255,255,255,.18)}
  .ctl[aria-pressed="false"]{opacity:.55}
  .reloj-video{font-variant-numeric:tabular-nums;font-size:14px;opacity:.8;margin-right:6px;align-self:center}

  /* Escenas */
  .escena{position:absolute;inset:0;padding:96px 64px 150px;display:none}
  .escena.activa{display:block}
  .col-texto{position:absolute;left:64px;top:110px;width:600px}
  .titulo{font-family:'Baloo 2';font-weight:800;font-size:58px;line-height:1.02;margin:0 0 22px;letter-spacing:-.5px}
  .titulo .lin{display:block;opacity:0;transform:translateY(24px)}
  .activa .titulo .lin{animation:subir .7s cubic-bezier(.2,.9,.3,1.2) forwards}
  .activa .titulo .lin:nth-child(2){animation-delay:.18s}
  @keyframes subir{to{opacity:1;transform:none}}
  .punto{display:flex;gap:14px;align-items:flex-start;font-size:23px;line-height:1.35;margin:14px 0;opacity:0;transform:translateX(-24px);transition:opacity .5s,transform .5s cubic-bezier(.2,.9,.3,1.2)}
  .punto.ver{opacity:1;transform:none}
  .punto .ic{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--c,#1E5BB8);box-shadow:0 4px 0 rgba(0,0,0,.25)}
  .punto b{color:var(--sol)}

  /* Teléfonos con capturas reales */
  .telefonos{position:absolute;right:70px;top:92px;width:520px;height:500px}
  .tel{position:absolute;width:236px;height:472px;border-radius:34px;background:#0a0f1c;padding:9px;box-shadow:0 24px 50px rgba(0,0,0,.5),inset 0 0 0 2px #2c3752;
    opacity:0;transform:translateY(60px) rotate(var(--r,0deg)) scale(.92);transition:opacity .6s,transform .8s cubic-bezier(.2,.9,.3,1.15)}
  .tel.ver{opacity:1;transform:translateY(0) rotate(var(--r,0deg)) scale(1)}
  .tel.fuera{opacity:0;transform:translateY(-30px) rotate(var(--r,0deg)) scale(.96)}
  .tel img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:26px;display:block}
  .tel::after{content:"";position:absolute;top:14px;left:50%;width:62px;height:6px;margin-left:-31px;border-radius:6px;background:#0a0f1c}
  .etiqueta-tel{position:absolute;bottom:-38px;left:0;right:0;text-align:center;font-family:'Baloo 2';font-weight:700;font-size:17px;color:var(--sol)}

  /* Escalera-línea de tiempo */
  .subtitulo{position:absolute;left:120px;right:120px;bottom:92px;text-align:center;font-size:22px;line-height:1.35;min-height:60px;display:flex;align-items:flex-end;justify-content:center;z-index:4}
  .subtitulo span{background:rgba(5,14,32,.72);padding:6px 16px;border-radius:12px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .linea-tiempo{position:absolute;left:28px;right:28px;bottom:18px;height:58px;display:flex;align-items:flex-end;gap:6px;z-index:5}
  .peldano{flex:1;position:relative;border:none;padding:0;border-radius:8px 8px 3px 3px;background:rgba(255,255,255,.1);overflow:hidden;transition:transform .2s}
  .peldano:hover{transform:translateY(-3px)}
  .peldano .relleno{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--c)}
  .peldano .nom{position:absolute;left:8px;right:4px;bottom:4px;font-size:11.5px;font-weight:700;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  .flecha-sube{position:absolute;bottom:62px;width:26px;height:26px;margin-left:-13px;transition:left .3s linear,bottom .3s;z-index:6;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}

  /* Portada */
  .portada{display:none;position:absolute;inset:0;text-align:center}
  .activa .portada, .portada.activa{display:block}
  .logo-grande{position:absolute;left:50%;top:34px;width:430px;margin-left:-215px;opacity:0;transform:scale(.7)}
  .activa .logo-grande{animation:aparecer 1.2s .2s cubic-bezier(.2,.9,.3,1.25) forwards}
  @keyframes aparecer{to{opacity:1;transform:scale(1)}}
  .nombre-grande{position:absolute;left:0;right:0;top:372px;font-family:'Baloo 2';font-weight:800;font-size:96px;line-height:1;margin:0;
    background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3),var(--g5),var(--g6),var(--g8),var(--g9));-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0}
  .activa .nombre-grande{animation:subir .9s 1.2s forwards}
  .lema{position:absolute;left:0;right:0;top:478px;font-size:28px;opacity:0}
  .activa .lema{animation:subir .8s 1.4s forwards}

  /* Cifras */
  .cifras{position:absolute;left:64px;right:64px;top:250px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
  .cifra{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12);border-radius:24px;padding:22px 18px;text-align:center;opacity:0;transform:translateY(30px) scale(.95);transition:opacity .5s,transform .6s cubic-bezier(.2,.9,.3,1.3)}
  .cifra.ver{opacity:1;transform:none}
  .cifra .n{font-family:'Baloo 2';font-weight:800;font-size:84px;line-height:1;color:var(--c)}
  .cifra .t{font-size:20px;margin-top:6px;line-height:1.3}

  /* Diploma */
  .diploma-foto{position:absolute;right:56px;top:130px;width:620px;border-radius:10px;box-shadow:0 30px 60px rgba(0,0,0,.55);opacity:0;transform:perspective(900px) rotateY(-18deg) translateX(60px);transition:opacity .8s,transform 1.1s cubic-bezier(.2,.9,.3,1.1)}
  .diploma-foto.ver{opacity:1;transform:perspective(900px) rotateY(-6deg)}
  .guia-foto{position:absolute;right:430px;top:360px;width:200px;border-radius:8px;box-shadow:0 20px 40px rgba(0,0,0,.5);opacity:0;transform:rotate(-8deg) translateY(40px);transition:opacity .6s,transform .8s}
  .guia-foto.ver{opacity:1;transform:rotate(-8deg)}
  .confeti{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;opacity:.9;animation:caer linear forwards}
  @keyframes caer{to{transform:translateY(780px) rotate(720deg)}}

  /* Cierre */
  .qr-final{position:absolute;right:90px;top:120px;width:380px;padding:26px 26px 20px;border-radius:28px;background:#fff;color:#0B2A5B;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.5);opacity:0;transform:scale(.85) rotate(-3deg)}
  .activa .qr-final{animation:qraparece .9s .9s cubic-bezier(.2,.9,.3,1.3) forwards}
  @keyframes qraparece{to{opacity:1;transform:none}}
  .qr-final img{width:300px;height:300px;display:block;margin:0 auto 10px;image-rendering:pixelated}
  .qr-final b{display:block;font-family:'Baloo 2';font-size:26px}
  .qr-final span{display:block;font-size:15px;color:#5B6780}
  .cierre-titulo{position:absolute;left:0;right:0;top:360px;text-align:center;font-family:'Baloo 2';font-weight:800;font-size:74px;line-height:1.05;opacity:0}
  .activa .cierre-titulo{animation:subir .9s .6s forwards}
  .cierre-sub{position:absolute;left:0;right:0;top:500px;text-align:center;font-size:26px;opacity:0}
  .activa .cierre-sub{animation:subir .8s 1.6s forwards}
  .escalera-final{position:absolute;left:50%;top:120px;margin-left:-260px;width:520px;height:220px;display:flex;align-items:flex-end;gap:8px}
  .escalera-final div{flex:1;border-radius:8px 8px 0 0;background:var(--c);height:0;transition:height .6s cubic-bezier(.2,.9,.3,1.3)}

  /* Pantallas de inicio y fin */
  .cubierta{position:absolute;inset:0;z-index:20;display:grid;place-items:center;text-align:center;background:rgba(5,14,32,.82);backdrop-filter:blur(6px)}
  .cubierta h1{font-family:'Baloo 2';font-weight:800;font-size:64px;margin:12px 0 4px;line-height:1}
  .cubierta p{font-size:22px;opacity:.85;margin:6px 0 26px}
  .boton-play{border:none;border-radius:999px;padding:18px 38px;font-family:'Baloo 2';font-weight:800;font-size:30px;color:#fff;background:linear-gradient(90deg,var(--naranja),#FFB347);box-shadow:0 8px 0 #B35F00,0 18px 40px rgba(242,140,27,.35);transition:transform .12s,box-shadow .12s}
  .boton-play:hover{transform:translateY(-2px)}
  .boton-play:active{transform:translateY(6px);box-shadow:0 2px 0 #B35F00}
  .ayuda-teclas{margin-top:22px;font-size:15px;opacity:.65}
  .oculto{display:none!important}
  .solo-cel{display:none}
  @media (pointer:coarse){ .solo-pc{display:none} .solo-cel{display:inline} }

  @media (prefers-reduced-motion:reduce){
    .simbolo{display:none}
    *{animation-duration:.01s!important;transition-duration:.01s!important}
  }
</style>
</head>
<body>
<div id="marco">
<div id="escenario" role="region" aria-label="Video de introducción de Solaris Math">
  <div class="cuadricula"></div>
  <div id="simbolos"></div>

  <div class="barra-sup">
    <div class="marca" id="marcaMini"></div>
    <div class="controles">
      <span class="reloj-video" id="relojVideo">0:00 / 1:00</span>
      <button class="ctl" id="btnVoz" aria-pressed="true" title="Narración (V)">🔊 Voz</button>
      <button class="ctl" id="btnMusica" aria-pressed="true" title="Música (M)">🎵 Música</button>
      <button class="ctl" id="btnPlay" title="Pausa o continuar (espacio)" aria-label="Pausa">⏸</button>
      <button class="ctl" id="btnPantalla" title="Pantalla completa (F)" aria-label="Pantalla completa">⛶</button>
    </div>
  </div>

  <div id="escenas"></div>

  <div class="subtitulo" aria-live="polite"><span id="subtitulo"></span></div>
  <svg class="flecha-sube" id="flecha" viewBox="0 0 26 26" aria-hidden="true"><polygon points="13,2 24,20 13,15 2,20" fill="#FFD23F"/></svg>
  <div class="linea-tiempo" id="lineaTiempo" aria-label="Capítulos"></div>

  <div class="cubierta" id="cubierta">
    <div>
      <div id="logoCubierta" style="width:320px;margin:0 auto"></div>
      <p>Un recorrido de 1 minuto por la app</p>
      <button class="boton-play" id="btnEmpezar">▶ Ver video</button>
      <div class="ayuda-teclas">Sube el volumen: tiene narración y música.<br><span class="solo-pc">Teclas: espacio pausa, ← → capítulos, F pantalla completa.</span><span class="solo-cel">📱 Gira el celular para verlo en grande.</span></div>
    </div>
  </div>
  <div class="cubierta oculto" id="fin">
    <div>
      <div id="logoFin" style="width:260px;margin:0 auto"></div>
      <h1>¡Gracias!</h1>
      <p>Solaris Math · Matemáticas que despegan</p>
      <button class="boton-play" id="btnRepetir">↺ Ver de nuevo</button>
    </div>
  </div>
</div>
</div>

/* ----- Escalado al tamaño de la pantalla ----- */
function escalar(){
  const w = window.innerWidth, h = window.innerHeight;
  // En un celular en vertical, la presentación se gira para usar toda la pantalla (como un video).
  const girar = h > w && w < 820;
  const k = girar ? Math.min(h / 1280, w / 720) : Math.min(w / 1280, h / 720);
  $('escenario').style.transform = `${girar ? 'rotate(90deg) ' : ''}scale(${k})`;
  $('escenario').style.borderRadius = k >= 0.99 ? '18px' : '0';
  document.body.classList.toggle('girada', girar);
}
window.addEventListener('resize', escalar);
window.addEventListener('orientationchange', () => setTimeout(escalar, 250));
if(window.visualViewport) window.visualViewport.addEventListener('resize', escalar);
escalar();

/* ----- Voz ----- */
const Voz = {
  activa: true, voz: null, cola: [], indice: 0, hablando: false, escena: -1, token: 0,
  femenina: false,
  elegir(){
    // Voz femenina en español: se reconoce por el nombre (varía según el dispositivo)
    const FEM = /female|mujer|sabina|dalia|salome|salomé|elvira|paloma|helena|laura|paulina|monica|mónica|marisol|lupe|penelope|penélope|lucia|lucía|mia|ximena|camila|valentina|catalina|elena|francisca|google español/i;
    const MASC = /\bmale\b|pablo|raul|raúl|jorge|diego|juan|alvaro|álvaro|gonzalo|enrique|miguel|carlos|gerardo|tomas|tomás|andres|andrés|jorge/i;
    const pref = ['es-CO', 'es-MX', 'es-US', 'es-419', 'es-ES'];
    const puntos = v => {
      const fem = FEM.test(v.name) && !MASC.test(v.name), masc = MASC.test(v.name) && !FEM.test(v.name);
      const p = pref.indexOf(v.lang);
      return (fem ? 0 : masc ? 40 : 20) + (/natural|online|neural|premium|enhanced|google/i.test(v.name) ? 0 : 5) + (p < 0 ? 9 : p);
    };
    const vs = speechSynthesis.getVoices().filter(v => /^es/i.test(v.lang)).sort((a, b) => puntos(a) - puntos(b));
    this.voz = vs[0] || null;
    this.femenina = !!this.voz && puntos(this.voz) < 20;
  },
  disponible(){ return 'speechSynthesis' in window && !!this.voz; },
  decir(frases, desde){
    this.parar();
    this.cola = frases; this.indice = desde || 0;
    if(!this.activa || !this.disponible()) return;
    const token = ++this.token;
    const siguiente = () => {
      if(token !== this.token || this.indice >= this.cola.length){ this.hablando = false; Musica.agachar(false); return; }
      const u = new SpeechSynthesisUtterance(this.cola[this.indice]);
      try{ u.voice = this.voz; }catch(e){} u.lang = this.voz.lang || 'es-CO'; u.rate = 0.98; u.pitch = this.femenina ? 1.05 : 1.25;
      u.onstart = () => { if(token === this.token){ mostrarSubtitulo(this.indice); } };
      u.onend = u.onerror = () => { if(token !== this.token) return; this.indice++; siguiente(); };
      this.hablando = true; Musica.agachar(true);
      speechSynthesis.speak(u);
    };
    siguiente();
  },
  parar(){ this.token++; this.hablando = false; if('speechSynthesis' in window) speechSynthesis.cancel(); Musica.agachar(false); }
};
if('speechSynthesis' in window){ Voz.elegir(); speechSynthesis.onvoiceschanged = () => Voz.elegir(); }

/* ----- Música generada (sin archivos) ----- */
const Musica = {
  ctx: null, gan: null, activa: true, intervalo: null, paso: 0,
  iniciar(){
    if(this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.gan = this.ctx.createGain(); this.gan.gain.value = 0.0001;
    const filtro = this.ctx.createBiquadFilter(); filtro.type = 'lowpass'; filtro.frequency.value = 1800;
    this.gan.connect(filtro).connect(this.ctx.destination);
    const acordes = [[261.63, 329.63, 392.00, 493.88], [220.00, 261.63, 329.63, 392.00], [174.61, 220.00, 261.63, 329.63], [196.00, 246.94, 293.66, 392.00]];
    const nota = (f, t, d, tipo, v) => { const o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.type = tipo; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.08); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g).connect(this.gan); o.start(t); o.stop(t + d + 0.1); };
    const compas = () => {
      if(!reproduciendo) return;
      const t = this.ctx.currentTime + 0.05, a = acordes[Math.floor(this.paso / 8) % 4];
      if(this.paso % 8 === 0) a.forEach(f => nota(f / 2, t, 3.9, 'sine', 0.16));
      nota(a[[0, 2, 1, 3, 2, 1, 3, 2][this.paso % 8]] * 2, t, 0.45, 'triangle', 0.09);
      this.paso++;
    };
    this.intervalo = setInterval(compas, 500);
    this.volumen();
  },
  volumen(){ if(!this.gan) return; const v = !this.activa || !reproduciendo ? 0.0001 : (Voz.hablando ? 0.18 : 0.42); this.gan.gain.setTargetAtTime(v, this.ctx.currentTime, 0.3); },
  agachar(){ this.volumen(); }
};

/* ----- Motor de reproducción ----- */
let actual = 0, tEscena = 0, reproduciendo = false, ultimo = 0, esperandoVoz = false;
function mostrarSubtitulo(k){ $('subtitulo').textContent = ESCENAS[actual].narr[k] || ''; $('subtitulo').parentElement.style.visibility = $('subtitulo').textContent ? 'visible' : 'hidden'; }
function irA(i){
  if(i < 0) i = 0;
  if(i >= ESCENAS.length){ terminar(); return; }
  actual = i; tEscena = 0; esperandoVoz = false;
  document.querySelectorAll('.escena').forEach(s => { s.classList.remove('activa'); s.querySelectorAll('.ver,.fuera').forEach(x => x.classList.remove('ver', 'fuera')); s.querySelectorAll('.escalera-final div').forEach(x => x.style.height = '0'); s.querySelectorAll('.confeti').forEach(x => x.remove()); });
  const s = document.querySelector(`.escena[data-i="${i}"]`);
  void s.offsetWidth;
  s.classList.add('activa');
  s.querySelectorAll('[data-cuenta]').forEach(n => n.textContent = /^\d+$/.test(n.dataset.cuenta) ? '0' : n.dataset.cuenta);
  mostrarSubtitulo(0);
  if(reproduciendo) Voz.decir(ESCENAS[i].narr, 0);
  pintarTiempo();
}
function actualizarEscena(){
  const e = ESCENAS[actual], s = document.querySelector(`.escena[data-i="${actual}"]`), t = tEscena / 1000;
  s.querySelectorAll('[data-at]').forEach(x => {
    const at = +x.dataset.at, hasta = x.dataset.hasta === '' || x.dataset.hasta === undefined ? Infinity : +x.dataset.hasta;
    if(t >= at && !x.classList.contains('ver') && t < hasta){
      x.classList.add('ver');
      if(x.dataset.h) x.style.height = x.dataset.h + 'px';
      const n = x.querySelector('[data-cuenta]');
      if(n && /^\d+$/.test(n.dataset.cuenta)) contar(n, +n.dataset.cuenta);
      if(x.classList.contains('diploma-foto')) confeti(s);
    }
    if(t >= hasta && x.classList.contains('ver')){ x.classList.add('fuera'); }
  });
  if(!Voz.activa || !Voz.disponible()){
    const frases = e.narr, pesos = frases.map(f => f.length), totalP = pesos.reduce((a, b) => a + b, 0);
    let acum = 0, k = 0; const avance = Math.min(1, t / Math.max(1, e.dur - 2));
    for(; k < frases.length; k++){ acum += pesos[k] / totalP; if(avance <= acum) break; }
    if($('subtitulo').textContent !== frases[Math.min(k, frases.length - 1)]) mostrarSubtitulo(Math.min(k, frases.length - 1));
  }
}
function contar(n, fin){
  const ini = performance.now(), dur = 1400;
  const paso = ahora => { const p = Math.min(1, (ahora - ini) / dur); n.textContent = Math.round(fin * (1 - Math.pow(1 - p, 3))); if(p < 1) requestAnimationFrame(paso); };
  requestAnimationFrame(paso);
}
function confeti(s){
  for(let k = 0; k < 70; k++){
    const c = document.createElement('div');
    c.className = 'confeti';
    c.style.cssText = `left:${Math.random() * 1280}px;background:${COL[k % COL.length]};animation-duration:${2.5 + Math.random() * 2.5}s;animation-delay:${Math.random() * 1.2}s;transform:rotate(${Math.random() * 360}deg)`;
    s.appendChild(c);
  }
}
function pintarTiempo(){
  const global = inicioDe(actual) + Math.min(tEscena / 1000, ESCENAS[actual].dur);
  const f = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  $('relojVideo').textContent = `${f(global)} / ${f(TOTAL)}`;
  const peld = [...document.querySelectorAll('.peldano')];
  peld.forEach((p, i) => { p.querySelector('.relleno').style.width = i < actual ? '100%' : i > actual ? '0' : `${Math.min(100, tEscena / 10 / ESCENAS[i].dur)}%`; });
  const b = peld[actual], r = b.getBoundingClientRect(), base = $('lineaTiempo').getBoundingClientRect(), k = base.width / $('lineaTiempo').offsetWidth;
  const x = (r.left - base.left) / k + (b.offsetWidth * Math.min(1, tEscena / 1000 / ESCENAS[actual].dur));
  $('flecha').style.left = `${28 + x}px`;
  $('flecha').style.bottom = `${24 + b.offsetHeight}px`;
}
function bucle(ahora){
  const dt = ultimo ? ahora - ultimo : 0; ultimo = ahora;
  if(reproduciendo){
    tEscena += dt;
    actualizarEscena();
    const e = ESCENAS[actual];
    const vozPendiente = Voz.activa && Voz.disponible() && (Voz.hablando || Voz.indice < e.narr.length);
    if(tEscena / 1000 >= e.dur && !vozPendiente) irA(actual + 1);
    else if(tEscena / 1000 >= e.dur + 8) irA(actual + 1);
    pintarTiempo();
  }
  requestAnimationFrame(bucle);
}
requestAnimationFrame(bucle);

function reproducir(){
  reproduciendo = true; $('escenario').classList.remove('pausado');
  $('btnPlay').textContent = '⏸'; $('btnPlay').setAttribute('aria-label', 'Pausa');
  Musica.iniciar(); if(Musica.ctx.state === 'suspended') Musica.ctx.resume();
  Voz.decir(ESCENAS[actual].narr, Voz.escena === actual ? Voz.indice : 0);
  Voz.escena = actual;
  Musica.volumen();
}
function pausar(){
  reproduciendo = false; $('escenario').classList.add('pausado');
  $('btnPlay').textContent = '▶'; $('btnPlay').setAttribute('aria-label', 'Continuar');
  const i = Voz.indice; Voz.parar(); Voz.indice = i; Voz.escena = actual;
  Musica.volumen();
}
function terminar(){ pausar(); $('fin').classList.remove('oculto'); }

$('btnEmpezar').onclick = () => { $('cubierta').classList.add('oculto'); if(!Voz.disponible()){ Voz.activa = false; $('btnVoz').setAttribute('aria-pressed', 'false'); $('btnVoz').title = 'Este navegador no tiene voces en español'; } irA(0); reproducir(); };
$('btnRepetir').onclick = () => { $('fin').classList.add('oculto'); irA(0); reproducir(); };
$('btnPlay').onclick = () => reproduciendo ? pausar() : reproducir();
$('btnVoz').onclick = () => {
  if(!Voz.disponible()){ $('btnVoz').title = 'Este navegador no tiene voces en español'; return; }
  Voz.activa = !Voz.activa; $('btnVoz').setAttribute('aria-pressed', Voz.activa);
  if(Voz.activa && reproduciendo) Voz.decir(ESCENAS[actual].narr, 0); else Voz.parar();
};
$('btnMusica').onclick = () => { Musica.activa = !Musica.activa; $('btnMusica').setAttribute('aria-pressed', Musica.activa); Musica.volumen(); };
$('btnPantalla').onclick = () => {
  const d = document, el = d.documentElement;
  if(d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
};
if(!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)) $('btnPantalla').classList.add('oculto');
document.addEventListener('keydown', e => {
  if(!$('cubierta').classList.contains('oculto')){ if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); $('btnEmpezar').click(); } return; }
  if(e.key === ' '){ e.preventDefault(); $('btnPlay').click(); }
  else if(e.key === 'ArrowRight'){ $('fin').classList.add('oculto'); irA(actual + 1); }
  else if(e.key === 'ArrowLeft'){ $('fin').classList.add('oculto'); irA(actual - 1); }
  else if(e.key.toLowerCase() === 'f') $('btnPantalla').click();
  else if(e.key.toLowerCase() === 'm') $('btnMusica').click();
  else if(e.key.toLowerCase() === 'v') $('btnVoz').click();
});
irA(0);
</script>
</body>
</html>
